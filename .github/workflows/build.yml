name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
      - run: npm install
      - run: npm run build
      - run: python -m py_compile projects/PineAI/src/module.py
