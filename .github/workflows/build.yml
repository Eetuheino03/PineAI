name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: npm ci
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Run Angular frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI --progress=false
      - name: Compile Python sources
        run: python -m compileall -q projects/PineAI/src/module.py projects/PineAI/src/assets
      - name: Resolve module version
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("projects/PineAI/src/module.json"))["version"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Scan tracked source for likely committed API keys
        run: |
          if git grep -nE 'sk-(proj-)?[A-Za-z0-9_-]{20,}'; then
            echo "A likely API key was found in tracked source."
            exit 1
          fi
      - name: Build Hak5 module package layout
        run: PATH="$PWD/node_modules/.bin:$PATH" ./build.sh package
      - name: Verify release package
        run: |
          PACKAGE="PineAI-${VERSION}.tar.gz"
          test -f dist/PineAI/PineAI.umd.js
          test -f dist/PineAI/module.py
          test -f dist/PineAI/module.json
          test -f dist/PineAI/module.svg
          test -f dist/PineAI/assets/pineai_backend/assurance.py
          test -f dist/PineAI/assets/pineai_backend/recon.py
          test -f dist/PineAI/assets/pineai_backend/assessment_store.py
          test -f dist/PineAI/assets/pineai_backend/assurance_service.py
          test -f dist/PineAI/assets/pineai_backend/assurance_profiles.py
          test -f dist/PineAI/assets/pineai_backend/consensus.py
          test -f dist/PineAI/assets/pineai_backend/customer_analysis.py
          test -f dist/PineAI/assets/pineai_backend/customer_store.py
          test -f dist/PineAI/assets/pineai_backend/storage_transaction.py
          test -f dist/PineAI/assets/pineai_backend/platform.py
          test -f dist/PineAI/assets/pineai_backend/backup.py
          test -f dist/PineAI/assets/pineai_backend/ai_analysis.py
          test -f dist/PineAI/assets/pineai_backend/reports.py
          test -f dist/PineAI/assets/pineai_backend/openai_client.py
          test -f dist/PineAI/assets/pineai_cli.py
          test ! -e dist/PineAI/assets/pineai_backend/advisor.py
          test ! -e dist/PineAI/assets/pineai_backend/adaptive_recon.py
          test ! -e dist/PineAI/assets/pineai_backend/engagement_store.py
          test ! -e dist/PineAI/assets/pineai_backend/profiler.py
          test -z "$(find dist/PineAI -type f -name '*.pyc' -print -quit)"
          test -f "$PACKAGE"
          test "$(tar -tzf "$PACKAGE" | sed -n '1p')" = "PineAI/"
          tar -tzf "$PACKAGE" PineAI/PineAI.umd.js > /dev/null
          test "$(tar --numeric-owner -tvzf "$PACKAGE" PineAI/module.py | awk '{print $1, $2}')" = "-rwxr-xr-x 0/0"
          test "$(tar --numeric-owner -tvzf "$PACKAGE" PineAI/module.json | awk '{print $1, $2}')" = "-rw-r--r-- 0/0"
          bash scripts/verify-package.sh "$PACKAGE"
          sha256sum "$PACKAGE" > "$PACKAGE.sha256"
          sha256sum -c "$PACKAGE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: PineAI-${{ env.VERSION }}
          path: |
            PineAI-${{ env.VERSION }}.tar.gz
            PineAI-${{ env.VERSION }}.tar.gz.sha256
