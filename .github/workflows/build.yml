name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: npm ci
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q projects/PineAI/src/module.py projects/PineAI/src/assets
      - name: Build Hak5 module package layout
        run: PATH="$PWD/node_modules/.bin:$PATH" ./build.sh
      - name: Verify backend assets are packaged
        run: |
          test -f dist/PineAI/assets/pineai_backend/service.py
          test -f dist/PineAI/assets/pineai_backend/openai_client.py
          test -f dist/PineAI/assets/pineai_cli.py
          test -z "$(find dist/PineAI -type f -name '*.pyc' -print -quit)"
